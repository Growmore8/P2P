<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Trade journal notebook with results">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2552"/><stop offset="1" stop-color="#2f6bff"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#g)"/>
  <!-- notebook -->
  <g transform="translate(230 50) rotate(-4)">
    <rect width="340" height="300" rx="18" fill="#ffffff"/>
    <rect width="40" height="300" rx="18" fill="#dbe6ff"/>
    <g fill="#9fb6e8"><circle cx="20" cy="50" r="6"/><circle cx="20" cy="110" r="6"/><circle cx="20" cy="170" r="6"/><circle cx="20" cy="230" r="6"/></g>
    <text x="70" y="52" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#0b2552">Trade Journal</text>
    <g font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#334155">
      <circle cx="80" cy="98" r="11" fill="#16a34a"/><path d="M74 98l4 4 8-9" stroke="#fff" stroke-width="3" fill="none"/>
