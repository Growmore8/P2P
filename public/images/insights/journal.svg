    </g>
    <polyline points="70,262 120,250 160,256 200,236 240,240 290,214" fill="none" stroke="#2f6bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- pen -->
  <g transform="translate(560 250) rotate(38)"><rect width="150" height="16" rx="8" fill="#f5b740"/><path d="M150 0l26 8-26 8z" fill="#0b2552"/></g>
  <text x="40" y="385" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#fff" fill-opacity=".9">Journal</text>
</svg>
