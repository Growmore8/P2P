<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Risk management shield with stop loss">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d0a12"/><stop offset="1" stop-color="#e5484d"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe4e6"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#g)"/>
  <!-- chart with stop loss -->
  <path d="M40 300H470" stroke="#fecaca" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="44" y="282" width="118" height="28" rx="14" fill="#991b1b"/><text x="103" y="302" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#fff">STOP LOSS</text>
  <path d="M40 140H470" stroke="#bbf7d0" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="44" y="122" width="118" height="28" rx="14" fill="#15803d"/><text x="103" y="142" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#fff">TAKE PROFIT</text>
  <polyline points="190,250 240,262 290,220 340,232 390,190 440,170 470,150" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- shield -->
  <g transform="translate(600 205)">
    <path d="M0 -125 L105 -88 V5 C105 75 55 115 0 135 C-55 115 -105 75 -105 5 V-88 Z" fill="url(#sh)"/>
    <path d="M0 -100 L82 -71 V3 C82 58 43 89 0 106 C-43 89 -82 58 -82 3 V-71 Z" fill="#e5484d" fill-opacity=".15"/>
    <path d="M-42 4 L-12 34 L46 -28" fill="none" stroke="#be123c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="40" y="385" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#fff" fill-opacity=".9">Risk</text>
</svg>
