<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Gold price candlestick chart">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a06"/><stop offset="1" stop-color="#c8901d"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a3"/><stop offset=".55" stop-color="#f5b740"/><stop offset="1" stop-color="#b9781a"/></linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#g)"/>
  <g stroke="#ffffff" stroke-opacity=".08">
    <path d="M0 105H800M0 210H800M0 315H800"/>
  </g>
  <!-- candlesticks -->
  <g stroke-width="3">
    <g stroke="#ffe1a0"><path d="M80 250V330M140 230V300M200 260V320M260 200V280M320 210V270M380 170V250M440 185V240M500 140V215M560 150V205M620 110V190"/></g>
    <rect x="70" y="268" width="20" height="44" rx="3" fill="#ffd36e"/>
    <rect x="130" y="244" width="20" height="40" rx="3" fill="#ffd36e"/>
    <rect x="190" y="270" width="20" height="34" rx="3" fill="#7a4a12"/>
    <rect x="250" y="214" width="20" height="50" rx="3" fill="#ffd36e"/>
    <rect x="310" y="222" width="20" height="34" rx="3" fill="#7a4a12"/>
    <rect x="370" y="184" width="20" height="50" rx="3" fill="#ffd36e"/>
    <rect x="430" y="196" width="20" height="30" rx="3" fill="#7a4a12"/>
    <rect x="490" y="152" width="20" height="48" rx="3" fill="#ffd36e"/>
    <rect x="550" y="160" width="20" height="32" rx="3" fill="#7a4a12"/>
