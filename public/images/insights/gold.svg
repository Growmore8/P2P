  </g>
  <polyline points="80,300 140,270 200,288 260,240 320,246 380,210 440,212 500,176 560,178 620,148" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".55" stroke-dasharray="6 8"/>
