  <circle cx="680" cy="92" r="44" fill="none" stroke="#a36a12" stroke-opacity=".45" stroke-width="3"/>
  <text x="680" y="108" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" fill="#7a4a12">Au</text>
  <text x="40" y="380" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#fff" fill-opacity=".9">XAU / USD</text>
